    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #030712; /* Corresponds to gray-950 */
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cormorant Garamond', serif;
      }
      
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(1rem); }
        to { opacity: 1; transform: translateY(0); }
      }

      /*
        Animation class for the Hero section.
        Defaults to being instantly visible for accessibility (reduced motion).
        The media query below overrides this for users who have not opted out of animations.
      */
      .will-animate {
        opacity: 1;
      }

      @media (prefers-reduced-motion: no-preference) {
        .will-animate {
          opacity: 0; /* Start hidden before animation */
          animation: fade-in-up 1s ease-out forwards;
        }
      }
    </style>
